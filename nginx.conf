upstream account_manager {
    server account-manager:3001;
}

upstream ledger_mechanism {
    server ledger-mechanism:3002;
}

upstream transactions_manager {
    server transactions-manager:3003;
}

server {
    listen 80;

    location /ledger {
        proxy_pass http://ledger_mechanism;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /transactions {
        proxy_pass http://transactions_manager;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /accounts {
        proxy_pass http://account_manager;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}