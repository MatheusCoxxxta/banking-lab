upstream account_manager {
    server account-manager:3001;
}

upstream transaction_ledger {
    server transaction-ledger:3002;
}

server {
    listen 80;

    location /money {
        proxy_pass http://transaction_ledger;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://account_manager;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}