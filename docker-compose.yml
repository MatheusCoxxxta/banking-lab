services:
  proxy:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - account-manager
      - ledger-mechanism

  account-manager:
    container_name: account-manager
    build:                       
      context: ./accounts
      dockerfile: Dockerfile 
    env_file: ./accounts/.env
    depends_on:
      - accounts-postgres

  ledger-mechanism:
    container_name: ledger-mechanism
    build:                       
      context: ./ledger
      dockerfile: Dockerfile 
    environment:
      DATABASE_URL: postgres://postgres:postgres@ledger-postgres:5432/ledger_db
    depends_on:
      - ledger-postgres

  transactions-manager:
    container_name: transactions-manager
    build:                       
      context: ./transactions
      dockerfile: Dockerfile
    env_file: ./transactions/.env
    depends_on:
      - transactions-postgres

  accounts-postgres:
    container_name: accounts-postgres
    image: postgres:16
    ports:
      - '${ACCOUNTS_DATABASE_PORT}:5432'
    volumes:
      - accounts-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${ACCOUNTS_DATABASE_PASSWORD}
      - POSTGRES_DB=${ACCOUNTS_DATABASE_NAME}

  ledger-postgres:
    container_name: ledger-postgres
    image: postgres:16
    ports:
      - '${LEDGER_DATABASE_PORT}:5432'
    volumes:
      - ledger-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${LEDGER_DATABASE_PASSWORD}
      - POSTGRES_DB=${LEDGER_DATABASE_NAME}

  transactions-postgres:
    container_name: transactions-postgres
    image: postgres:16
    ports:
      - '${TRANSACTIONS_DATABASE_PORT}:5432'
    volumes:
      - transactions-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${TRANSACTIONS_DATABASE_PASSWORD}
      - POSTGRES_DB=${TRANSACTIONS_DATABASE_NAME}

volumes:
  transactions-postgres: {}
  accounts-postgres: {}
  ledger-postgres: {}
