# Operações manuais no projeto: status, logs, remover.
# Tudo age no container do projeto (fixado pela chave SSH) — sem argumento de nome.
#   ps     -> status + uso de CPU/memória
#   logs   -> últimas linhas do container
name: ops

on:
  workflow_dispatch:
    inputs:
      cmd:
        type: choice
        options: [ps, logs]
        default: ps

permissions:
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.ACC_VPS_SSH_KEY }}
          KNOWN: ${{ secrets.ACC_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Executa
        env:
          VPS: ${{ secrets.VPS_HOST }}
          CMD: ${{ inputs.cmd }}
        run: ssh "deployer@$VPS" "$CMD" < /dev/null
