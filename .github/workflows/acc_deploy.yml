name: accounts deploy

on:
  push:
    branches: [main]
    paths:
      - "accounts/**"
      - ".github/workflows/acc_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-deploy-accounts
  cancel-in-progress: false

env:
  PROJETO: "bankacc"   # nome do projeto = subdomínio (fixado na chave SSH pelo mentor)
  PORT: "3001"         # porta que o app escuta dentro do container

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Nome da imagem
        # imagem por serviço, senão os serviços do monorepo se sobrescrevem no GHCR
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/accounts:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./accounts        # Dockerfile fica em accounts/ (monorepo)
          push: true
          tags: ${{ env.IMAGE }}
          platforms: linux/amd64     # linux/arm64 se a VPS for ARM
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH
        env:
          KEY: ${{ secrets.ACC_VPS_SSH_KEY }}
          KNOWN: ${{ secrets.ACC_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS: ${{ secrets.VPS_HOST }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # única env sensível do app; as demais são fixas (host/porta) ou = nome do projeto
          DATABASE_PASSWORD: ${{ secrets.ACC_DATABASE_PASSWORD }}
        run: |
          # Monta o .env do container a partir de valores fixos + secrets.
          # stdin: linha1=usuário GHCR, linha2=token GHCR, resto=KEY=VALUE do app.
          {
            printf '%s\n%s\n' "$GH_USER" "$GH_TOKEN"
            printf 'DATABASE_HOST=%s\n'     'db'
            printf 'DATABASE_PORT=%s\n'     '5432'
            printf 'DATABASE_USER=%s\n'     "$PROJETO"
            printf 'DATABASE_NAME=%s\n'     "$PROJETO"
            printf 'DATABASE_PASSWORD=%s\n' "$DATABASE_PASSWORD"
            printf 'PORT=%s\n'              "$PORT"
          } | ssh "deployer@$VPS" deploy "$IMAGE" "$PORT"
