name: accounts deploy

on:
  push:
    branches: [main]
    paths:
      - "accounts/**"
      - ".github/workflows/acc_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-deploy-accounts
  cancel-in-progress: false

env:
  PORT: "3001"      # deve bater com o PORT dentro de ACC_APP_ENV (porta que o app escuta)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Nome da imagem
        # imagem por serviço, senão os serviços do monorepo se sobrescrevem no GHCR
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/accounts:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./accounts        # Dockerfile fica em accounts/ (monorepo)
          push: true
          tags: ${{ env.IMAGE }}
          platforms: linux/amd64     # linux/arm64 se a VPS for ARM
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH
        env:
          KEY: ${{ secrets.ACC_VPS_SSH_KEY }}
          KNOWN: ${{ secrets.ACC_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS: ${{ secrets.VPS_HOST }}
          APP_ENV: ${{ secrets.ACC_APP_ENV }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # stdin: usuário, token do GHCR (só para o pull) e o .env do app.
          # O projeto (subdomínio) é fixado pela chave SSH, não vai no comando.
          { printf '%s\n%s\n' "$GH_USER" "$GH_TOKEN"; printf '%s\n' "$APP_ENV"; } \
            | ssh "deployer@$VPS" deploy "$IMAGE" "$PORT"
